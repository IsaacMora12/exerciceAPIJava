spring.application.name=exerciceAPI
spring.main.banner-mode=off
spring.profiles.active=garage
logging.level.org.springframework=ERROR

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Garage (S3-compatible) — credenciales SOLO desde el entorno (nunca commiteadas)
# El endpoint es sobreescribible por entorno: en Docker, Garage está en la red de
# compose y se lo alcanza como http://garage:3900 (default del compose).
garage.endpoint=${GARAGE_ENDPOINT:http://localhost:3900}
# Endpoint que ven el CLIENTE (browser): las URLs presignadas se firman contra
# este host, así que debe ser resoluble desde la máquina del cliente, NO desde el
# contenedor (en Docker: http://localhost:3900 — puerto publicado de garage).
garage.public-endpoint=${GARAGE_PUBLIC_ENDPOINT:http://localhost:3900}
garage.bucket=exercise-app
garage.access-key=${GARAGE_ACCESS_KEY:}
garage.secret-key=${GARAGE_SECRET_KEY:}
# public | presigned — cómo expone getUrl() los objetos de Garage.
# DEFAULT = presigned: Garage v2.x NO acepta acceso anónimo en el endpoint S3
# (3900) y responde 403 "Garage does not support anonymous access yet"
# (verify_request, src/api/common/signature/mod.rs del tag v2.3.0); lo público
# solo sirve vía website endpoint (3902). El modo presigned firma cada URL con
# expiración = garage.presign-expiry-seconds y NO requiere red.
# Sobreescribible con GARAGE_URL_MODE (p.ej. contra MinIO/S3 con anónimo habilitado).
garage.url-mode=${GARAGE_URL_MODE:presigned}
# Validez de las presigned URLs (SR4): 900 s = 15 min
garage.presign-expiry-seconds=900

# Raíz de almacenamiento local (perfil dev): absoluta y estable entre arranques,
# fuera del repo — la sirve la app en /media/**
storage.local.root=${user.home}/.exerciceapi/media

# Multipart: el default de Boot (1MB) rechaza imágenes de 1-5MB ANTES de llegar
# al validador de dominio. max-file-size respeta el límite de VideoFileValidator (10MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB